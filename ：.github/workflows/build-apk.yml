
name: Build Qobuz Google TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check pairing protocol
        run: |
          mkdir -p .verify-classes
          javac -d .verify-classes app/src/main/java/com/qobuztv/remote/Wire.java tests/ProtocolSelfTest.java
          java -cp .verify-classes com.qobuztv.remote.ProtocolSelfTest

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qobuz-TV-Remote-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
